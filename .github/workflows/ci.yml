name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  issues: write
  statuses: write

env:
  EFMT_ETL_INCLUDE: ${{ github.workspace }}/etl-3rd/include/etl

jobs:
  checks:
    name: Full check suite (host + MCU footprint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout ETL (elog / ETL-type integration tests)
        uses: actions/checkout@v4
        with:
          repository: ETLCPP/etl
          path: etl-3rd

      - name: Install ARM cross toolchain (footprint probe)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-arm-none-eabi

      # 全量：host c++17/c++20 行为检查 + 浮点对拍 + E_FMT_DERIVE/eserde/ecli/elog 集成
      # + 14 项编译期负例 + sandbox 冒烟 + -Size 交叉体积读数。
      # 宿主自带 pwsh 7；xtensa-esp32-elf-g++ 未安装时体积探针自动跳过（不红）。
      # 失败时把日志尾部以 ::error:: 注解导出（check-run annotations 公开可读，便于排查）。
      - name: Run full check suite
        shell: bash
        run: |
          set +e
          echo "== pwsh probe =="
          pwsh --version
          echo "== run =="
          pwsh ./tests/run_check.ps1 -Size > /tmp/ci.log 2>&1
          ec=$?
          set -e
          echo "== exit=$ec =="
          echo "toklen=${#GITHUB_TOKEN} sha=${GITHUB_SHA:0:7}" >> /tmp/ci.log
          if [ $ec -ne 0 ]; then
            { echo "== tail start =="; tail -n 40 /tmp/ci.log; } | sed 's/%/%25/g; s/\r//g' | while IFS= read -r line; do echo "::error::$line"; done
            info=$(tail -n 10 /tmp/ci.log | tr '\n' '|' | sed 's/"/_/g' | head -c 120)
            curl -s -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} \
              -d "{\"state\":\"failure\",\"context\":\"ci/tail\",\"description\":\"$info\"}"
            pybody=$(python3 -c "import json; log=open('/tmp/ci.log','rb').read()[-3000:].decode('utf-8','replace'); print(json.dumps({'title':'CI failure ${GITHUB_SHA:0:7}','body':'run_check tail:\n\n' + log}))")
            curl -s -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/${{ github.repository }}/issues -d "$pybody" > /dev/null
          fi
          exit $ec

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-log
          path: /tmp/ci.log
          retention-days: 1